name: IPA

# Builds an unsigned (ad-hoc signed) IPA from this repository, the way scripts/make-ipa.sh does on a Mac.
#
# The device build needs compiled parts that are not in the repository (docs/BUILDING.md):
#
#   * runtime/ (the JRE and our native libraries, plus the game's converted libraries) and Frameworks/MetalANGLE.framework:
#     taken from a pziOS release IPA by default. Set PZIOS_SOURCE_IPA_URL to use a different IPA, or PZIOS_BINARIES_URL
#     to a zip whose top level holds runtime/ and Frameworks/ (your own build of them).
#   * StikJIT.xcframework: downloaded from the StikJIT project's releases. Set PZIOS_STIKJIT_URL to use another build.
#
# The result contains that release's JRE and game libraries, so keep the artifact to yourself.
# Every run leaves pziOS-ipa as an artifact; a tag push (v*) also attaches it to that release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  ipa:
    name: Unsigned IPA
    # Xcode 26 or later: StikJIT.xcframework ships Swift 6.2 module interfaces (Swift::Error and friends), which older
    # compilers cannot read. The launcher job stays on macos-15, where the UI target builds fine.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write          # only used to attach the IPA to a release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "${LATEST:-}" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::This runner has the iOS $SDK SDK. StikJIT.xcframework is built with Swift 6.2, so the IPA job needs Xcode 26 or later."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unpack the build inputs
        env:
          ZIP_URL: ${{ vars.PZIOS_BINARIES_URL }}
          SOURCE_IPA_URL: ${{ vars.PZIOS_SOURCE_IPA_URL }}
          STIKJIT_URL: ${{ vars.PZIOS_STIKJIT_URL }}
        run: |
          set -euo pipefail
          rm -rf HostApp/runtime HostApp/Frameworks

          if [ -n "${ZIP_URL:-}" ]; then
            echo "Using PZIOS_BINARIES_URL"
            mkdir -p "$RUNNER_TEMP/inputs"
            curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/inputs/payload" "$ZIP_URL"
            case "$ZIP_URL" in
              *.zip) unzip -q -o "$RUNNER_TEMP/inputs/payload" -d "$RUNNER_TEMP/inputs" ;;
              *)     tar -xzf "$RUNNER_TEMP/inputs/payload" -C "$RUNNER_TEMP/inputs" ;;
            esac
            [ -d "$RUNNER_TEMP/inputs/runtime" ]    && cp -R "$RUNNER_TEMP/inputs/runtime" HostApp/runtime
            [ -d "$RUNNER_TEMP/inputs/Frameworks" ] && cp -R "$RUNNER_TEMP/inputs/Frameworks" HostApp/Frameworks
          else
            DEFAULT_IPA="https://github.com/onlyknt/pziOS/releases/download/pziOS/pziOS-0.9.0-beta.5-b42.21.ipa"
            URL="${SOURCE_IPA_URL:-$DEFAULT_IPA}"
            echo "Using the compiled parts of $URL"
            curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/source.ipa" "$URL"
            mkdir -p "$RUNNER_TEMP/source"
            unzip -q "$RUNNER_TEMP/source.ipa" -d "$RUNNER_TEMP/source"

            APP=$(find "$RUNNER_TEMP/source/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)
            [ -n "$APP" ] || { echo "::error::The source IPA has no Payload/*.app"; exit 1; }
            RUNTIME=$(find "$APP" -maxdepth 1 -type d -name runtime -print -quit)
            [ -n "$RUNTIME" ] || { echo "::error::The source IPA has no runtime/ folder (the JRE and the native libraries)"; exit 1; }
            cp -R "$RUNTIME" HostApp/runtime

            mkdir -p HostApp/Frameworks
            METAL=$(find "$APP" -maxdepth 3 -name 'MetalANGLE.framework' -type d -print -quit)
            [ -n "$METAL" ] || { echo "::error::The source IPA has no MetalANGLE.framework"; exit 1; }
            cp -R "$METAL" HostApp/Frameworks/
          fi

          # StikJIT has to be a real xcframework: the helper imports its Swift module to compile.
          DEFAULT_STIKJIT="https://github.com/StikDebug/StikJIT/releases/download/1.9.0/StikJIT.xcframework.zip"
          SJ_URL="${STIKJIT_URL:-$DEFAULT_STIKJIT}"
          echo "Using StikJIT.xcframework from $SJ_URL"
          mkdir -p "$RUNNER_TEMP/stikjit"
          if curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/stikjit.zip" "$SJ_URL"; then
            unzip -q -o "$RUNNER_TEMP/stikjit.zip" -d "$RUNNER_TEMP/stikjit"
            XC=$(find "$RUNNER_TEMP/stikjit" -maxdepth 2 -name 'StikJIT.xcframework' -type d -print -quit)
            if [ -n "$XC" ]; then
              mkdir -p HostApp/Frameworks
              rm -rf HostApp/Frameworks/StikJIT.xcframework
              cp -R "$XC" HostApp/Frameworks/
            else
              echo "::warning::That StikJIT.xcframework.zip has no StikJIT.xcframework inside"
            fi
          else
            echo "::warning::Could not download StikJIT.xcframework; falling back to the copy inside the source IPA"
          fi
          if [ ! -d HostApp/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework ] && [ -d "$RUNNER_TEMP/source/Payload" ]; then
            APP="${APP:-$(find "$RUNNER_TEMP/source/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)}"
            if [ -n "$APP" ]; then
              STIK=$(find "$APP" -name 'StikJIT.framework' -type d -print -quit)
              if [ -n "$STIK" ]; then
                mkdir -p HostApp/Frameworks/StikJIT.xcframework/ios-arm64
                cp -R "$STIK" HostApp/Frameworks/StikJIT.xcframework/ios-arm64/
              fi
            fi
          fi

          du -sh HostApp/runtime HostApp/Frameworks 2>/dev/null || true

      - name: Check what the device build needs
        run: |
          set -u
          missing=0
          need() { if [ ! -e "$1" ]; then echo "missing: $1"; missing=1; fi; }
          need HostApp/runtime/jre/lib/libjli.dylib
          need HostApp/Frameworks/MetalANGLE.framework
          need HostApp/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework
          for l in libglfw libGLshim libgl4es_114 libEGLproxy libfmodhal libfmodhal_ca; do
            need "HostApp/runtime/natives/$l.dylib"
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Those files are not in the repository (docs/BUILDING.md). Set PZIOS_BINARIES_URL to a zip whose top level holds runtime/ and Frameworks/, or PZIOS_SOURCE_IPA_URL to a pziOS IPA that contains them."
            exit 1
          fi

      - name: Build the IPA
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh HostApp/sign_jre.sh
          scripts/make-ipa.sh "$RUNNER_TEMP/pziOS.ipa"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: pziOS-ipa
          path: ${{ runner.temp }}/pziOS.ipa
          if-no-files-found: error

      - name: Attach the IPA to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA by the IPA workflow."
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/pziOS.ipa" --clobber
