name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "licenses/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "licenses/**", "**/*.md"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher UI (ZomUIPreview)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # xcodegen validates that every source directory in project.yml exists. The device target lists HostApp/runtime
      # (the bundled JRE and our native libraries), which is not in the repository (see docs/BUILDING.md), so create it
      # empty here: this job builds the launcher UI target, which only needs Sources.
      - name: Prepare the source tree
        run: mkdir -p HostApp/runtime

      - name: Generate the Xcode project from project.yml
        working-directory: HostApp
        run: xcodegen generate

      # The device target needs the bundled JRE and MetalANGLE, which are not in the repository (see docs/BUILDING.md), so
      # CI builds the launcher UI target: it compiles every Swift source, including the controller settings and editor.
      - name: Build the launcher UI target
        working-directory: HostApp
        run: |
          xcodebuild \
            -project pziOS.xcodeproj \
            -scheme ZomUIPreview \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  overlay:
    name: On-screen overlay (libglfw)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The same compile as the IPA workflow, so a change to the touch overlay is built by CI on every push instead of
      # only being tried when an IPA is made. It needs nothing from the repository but the one source file.
      - name: Compile native/glfw-ios
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 \
            -dynamiclib -fobjc-arc -O2 -install_name @rpath/libglfw.dylib \
            native/glfw-ios/glfw_ios.m \
            -framework UIKit -framework Foundation -framework QuartzCore -framework Metal \
            -framework CoreGraphics -framework ImageIO -framework GameController \
            -o libglfw.dylib
          lipo -archs libglfw.dylib