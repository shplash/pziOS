name: Build

# One job per push: it compiles the touch overlay and the launcher, swaps them into an official release IPA (which keeps
# that release's Java runtime, graphics libraries and JIT helper) and attaches the result to the draft "builds" release,
# so a push costs one macOS runner instead of two. The launcher UI target used to be built again in a second job; the
# app build here compiles the same Swift sources, so that second build only ever cost runner time.
#
# Cached between runs: the upstream release IPA (keyed by its tag; it is the largest download of a run and never changes
# for a tag) and Homebrew's download cache (so xcodegen comes from the cache instead of the network). Both are checked
# before use and fetched again when an entry is missing or damaged, so the cache can never produce a broken IPA.
#
# A new push replaces the run that is still going (see concurrency below): one build per branch at a time, nothing is
# built twice.
#
# It starts on its own for pushes that touch code, and by hand from the Actions tab (with any release tag). The IPA is
# uploaded as the pziOS-ipa artifact and attached to the draft "builds" release, so it can be downloaded like any other
# release asset.
#
# The swap idea comes from github.com/bradleyowenyoung-prog/PZIOS-Touch-Control- (same GPL-3 project).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "licenses/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "licenses/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "pziOS release to patch (blank = the latest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true     # a new push cancels the run it replaces, so only one build per branch is ever in flight

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 60      # one job now does what the compile check and the IPA job used to do in turn
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"      # the bottles are cached below; refreshing the formula database only costs time
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-xcodegen
          restore-keys: brew-${{ runner.os }}-

      - name: Find the release to patch
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then T="$TAG"; else T=$(gh release view --repo onlyknt/pziOS --json tagName --jq .tagName); fi
          [ -n "$T" ] || { echo "::error::could not work out which release to patch"; exit 1; }
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "patching release $T"

      - name: Cache the release IPA
        id: ipa-cache
        uses: actions/cache@v4
        with:
          path: dl
          key: pz-ipa-${{ steps.upstream.outputs.tag }}

      - name: Download the release IPA
        if: steps.ipa-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "${{ steps.upstream.outputs.tag }}" --repo onlyknt/pziOS --pattern '*.ipa' --dir dl

      - name: Unpack the release IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The IPA with the game's libraries first; the no-game-libs one is only a fallback.
          pick() { ls dl/*.ipa 2>/dev/null | grep -vi no-game-libs | head -1 || true; }
          IPA=$(pick)
          [ -n "$IPA" ] || IPA=$(ls dl/*.ipa 2>/dev/null | head -1 || true)
          if [ -z "$IPA" ] || ! /usr/bin/unzip -t "$IPA" >/dev/null 2>&1; then
            echo "::warning::the cached release IPA is missing or damaged, downloading it again"
            rm -rf dl x; mkdir -p dl
            gh release download "${{ steps.upstream.outputs.tag }}" --repo onlyknt/pziOS --pattern '*.ipa' --dir dl
            IPA=$(pick)
            [ -n "$IPA" ] || IPA=$(ls dl/*.ipa 2>/dev/null | head -1 || true)
          fi
          [ -n "$IPA" ] || { echo "::error::no IPA in that release"; exit 1; }
          echo "using $IPA"
          rm -rf x; mkdir -p x
          (cd x && unzip -q "../$IPA")
          APP=$(ls -d "$PWD"/x/Payload/*.app 2>/dev/null | head -1 || true)
          [ -n "$APP" ] || { echo "::error::the IPA has no Payload/*.app"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Build the touch overlay (libglfw.dylib)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 \
            -dynamiclib -fobjc-arc -O2 -install_name @rpath/libglfw.dylib \
            native/glfw-ios/glfw_ios.m \
            -framework UIKit -framework Foundation -framework QuartzCore -framework Metal \
            -framework CoreGraphics -framework ImageIO -framework GameController \
            -o libglfw.dylib
          lipo -archs libglfw.dylib

      - name: Build the launcher executable
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          mkdir -p HostApp/Frameworks HostApp/runtime
          cp -R "$APP/Frameworks/MetalANGLE.framework" HostApp/Frameworks/      # only linked against; the release copy stays in the IPA
          # The JIT helper extension needs StikJIT, which is not in this repository: keep the release's own, unchanged extension.
          sed -i '' '/^      - target: ZomJITHelper$/d' HostApp/project.yml
          if grep -q "target: ZomJITHelper" HostApp/project.yml; then echo "::error::could not drop the JIT helper dependency"; exit 1; fi
          (cd HostApp && xcodegen generate)
          xcodebuild -project HostApp/pziOS.xcodeproj -target pziOS -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PZ_BUNDLE_ID=com.knt.pzios PZ_TEAM_ID="" PZ_DISPLAY_NAME=pziOS build | tail -40
          ls -la build/Release-iphoneos/pziOS.app/pziOS
          find build/Release-iphoneos/pziOS.app -maxdepth 2 \( -name '*.lua' -o -name '*.args' \) -print

      - name: Swap the new parts into the IPA
        run: |
          set -euo pipefail
          T=$(find "$APP" -name libglfw.dylib -print -quit)
          [ -n "$T" ] || { echo "::error::libglfw.dylib not found inside the IPA"; exit 1; }
          echo "replacing $T"
          # Warn about functions the release overlay exports and ours does not (features a test build would lose)
          nm -gUj "$T" | sort > old-symbols.txt; nm -gUj libglfw.dylib | sort > new-symbols.txt
          MISSING=$(comm -23 old-symbols.txt new-symbols.txt || true)
          [ -z "$MISSING" ] || echo "::warning::the release overlay exports functions this build does not: $(echo $MISSING)"
          cp libglfw.dylib "$T"; codesign -f -s - "$T"

          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          # The app's entitlements (increased memory limit, debugger access for JIT) live in the release's signature: read them
          # before anything is replaced, and sign with them at the end.
          ENT="$PWD/app-entitlements.plist"
          codesign -d --entitlements - --xml "$APP/$EXE" > "$ENT" 2>/dev/null || codesign -d --entitlements :- "$APP/$EXE" > "$ENT"
          [ -s "$ENT" ] || { echo "::error::could not read the release app's entitlements"; exit 1; }
          cp build/Release-iphoneos/pziOS.app/pziOS "$APP/$EXE"

          # The game's own Lua scripts come from this build, not from the release IPA (which predates them). Without them the
          # app cannot install pziOSDrive.lua given to the game, so the driving layout never switches by itself and the log
          # says "driving layout script missing from the app".
          SRC_APP="$PWD/build/Release-iphoneos/pziOS.app"
          for f in pziOSSafeArea.lua pziOSDrive.lua; do
            S=$(find "$SRC_APP" -name "$f" -print -quit)
            [ -n "$S" ] || { echo "::error::$f is not in the built app, so the patched IPA would not have it"; exit 1; }
            cp "$S" "$APP/$(basename "$S")"
            echo "resource: $(basename "$S")"
          done
          S=$(find "$SRC_APP" -name 'default.launch.args' -print -quit)
          [ -z "$S" ] || cp "$S" "$APP/default.launch.args"

          codesign -f -s - --entitlements "$ENT" "$APP/$EXE"
          codesign -f -s - "$APP"
          codesign --verify --deep --strict "$APP"
          (cd x && rm -f ../pziOS.ipa && zip -qry ../pziOS.ipa Payload)
          ls -la pziOS.ipa
          /usr/bin/unzip -t pziOS.ipa >/dev/null
          /usr/bin/unzip -Z1 pziOS.ipa | grep -qx "Payload/$(basename "$APP")/Info.plist"
          # The scripts that make the automatic driving switch work must be inside the finished file, not just the build.
          for f in pziOSSafeArea.lua pziOSDrive.lua; do
            /usr/bin/unzip -Z1 pziOS.ipa | grep -qx "Payload/$(basename "$APP")/$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pziOS-ipa
          path: pziOS.ipa
          if-no-files-found: error

      # Same idea as the ModShelf repo: the draft "builds" release holds the newest IPA, so it can be downloaded from the
      # Releases page instead of digging through Actions artifacts.
      - name: Attach the IPA to the builds release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PLIST="$APP/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null || echo 0)
          NAME="pziOS-$VERSION-$BUILD-${{ github.run_number }}.ipa"
          cp pziOS.ipa "$NAME"
          if ! gh release view builds --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create builds --draft --repo "$GITHUB_REPOSITORY" \
              --title "pziOS builds" \
              --notes "Draft release holding CI builds. It is never published, so only people with write access can see it."
          fi
          gh release upload builds "$NAME" --clobber --repo "$GITHUB_REPOSITORY"
          echo "uploaded $NAME"
          gh release view builds --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while read -r asset; do
              [ -z "$asset" ] && continue
              [ "$asset" = "$NAME" ] && continue
              case "$asset" in
                pziOS-*.ipa) gh release delete-asset builds "$asset" --yes --repo "$GITHUB_REPOSITORY" || true ;;
              esac
            done
